version: 2
# Managed by mycelium-vault scripts/sync-dependabot-automerge.py. Edit the
# template (scripts/dependabot-templates/) and re-sync; do not hand-edit here.
# cooldown: a release must be 7 days old before dependabot proposes it, so a
# freshly published (possibly compromised) version never lands the same week.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]
